<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <linearGradient id="pipeWallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3E6D" />
      <stop offset="50%" stop-color="#102B50" />
      <stop offset="100%" stop-color="#091A30" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C98F" />
      <stop offset="50%" stop-color="#C5A15A" />
      <stop offset="100%" stop-color="#9C7932" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Pipe Emblem Group -->
  <g transform="translate(10, 5)" filter="url(#subtleGlow)">
    <!-- Outer Concrete Wall -->
    <circle cx="45" cy="45" r="42" fill="url(#pipeWallGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Steel Rebar Reinforcement Ring (Dotted/Dashed Circle) -->
    <circle cx="45" cy="45" r="33" fill="none" stroke="#C5A15A" stroke-width="2.5" stroke-dasharray="3, 4.5" opacity="0.85" />
    <circle cx="45" cy="45" r="25" fill="#091A30" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Internal Core (Internal Diameter ID representation) -->
    <circle cx="45" cy="45" r="18" fill="#102B50" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Bold Stylized Industrial 'U' in Center -->
    <path d="M38 35 V47 C38 52 52 52 52 47 V35" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="45" cy="45" r="4" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: UDHAYA SPUN PIPES -->
  <g transform="translate(115, 20)">
    <!-- Primary Brand Name -->
    <text x="0" y="32" font-family="'Manrope', 'Montserrat', 'Segoe UI', sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      UDHAYA <tspan fill="url(#goldGrad)">SPUN PIPES</tspan>
    </text>
    
    <!-- Subtitle / Positioning -->
    <text x="2" y="54" font-family="'Inter', 'Poppins', 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#8FA4C2">
      RCC PIPES &amp; PRECAST INFRASTRUCTURE
    </text>

    <!-- Location Accent Badge -->
    <text x="2" y="69" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#C5A15A">
      MANAMADURAI, SIVAGANGA, TAMIL NADU
    </text>
  </g>
</svg>
